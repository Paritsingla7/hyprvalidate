name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The luac -p syntax gate shells out to a real Lua compiler.
      - name: Install lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Install
        run: pip install -e '.[dev]'

      # Runs without Hyprland installed - the suite falls back to the
      # committed schema.json snapshot.
      - name: Test
        run: pytest tests/ -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Guards the exact regression that broke `pipx install` once already:
      # adding a top-level directory made setuptools refuse to build.
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      - name: Install the built wheel and run the CLI
        run: |
          pip install dist/*.whl
          hyprvalidate --help
          hyprvalidate check --help
          hyprvalidate convert --help

      - name: Convert and check a real config end to end
        run: |
          hyprvalidate convert tests/fixtures/hyprland.conf \
            --split /tmp/out --stub schema.json || true
          test -f /tmp/out/hyprland.lua
          test -f /tmp/out/keybinds.lua

  site-bundle-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # site/bundle.js embeds the Python source and schema.json. If someone
      # edits a module without regenerating it, the live demo silently runs
      # stale code - the exact drift class this project exists to prevent.
      - name: Regenerate bundle and fail if it differs
        run: |
          python site/build_bundle.py
          if ! git diff --exit-code --stat site/bundle.js; then
            echo "::error::site/bundle.js is stale. Run: python site/build_bundle.py"
            exit 1
          fi
