name: Bug report
description: Something crashed, or behaved unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command you ran.
      render: console
      placeholder: $ hyprvalidate check ~/.config/hypr
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Full output
      description: Including the traceback if it crashed.
      render: console
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "hyprvalidate 0.1.0, Hyprland 0.56.2, Python 3.13, Arch"
    validations:
      required: true
