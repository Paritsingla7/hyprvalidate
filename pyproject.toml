[project]
name = "hyprvalidate"
version = "0.1.0"
description = "Convert and validate Hyprland Lua configs against Hyprland's real API schema"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paritsingla7" }]
keywords = ["hyprland", "hyprlang", "lua", "config", "converter", "validator", "wayland"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: Window Managers",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "luaparser>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
hyprvalidate = "hyprvalidate.cli:main"

[project.urls]
Homepage = "https://paritsingla7.github.io/hyprvalidate/"
Source = "https://github.com/Paritsingla7/hyprvalidate"
Issues = "https://github.com/Paritsingla7/hyprvalidate/issues"
Changelog = "https://github.com/Paritsingla7/hyprvalidate/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["hyprvalidate*"]
