[project]
name = "hyprvalidate"
version = "0.0.1"
description = "Schema-driven validator for Hyprland's Lua config format"
requires-python = ">=3.10"
dependencies = [
    "luaparser>=4.1.0",
]

[project.scripts]
hyprvalidate = "hyprvalidate.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["hyprvalidate*"]
